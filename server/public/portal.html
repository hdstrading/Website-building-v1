<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HDS Trading Payroll Solutions — Employee Portal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2317408b'/><rect x='17' y='47' width='30' height='5' rx='2.5' fill='%23e11d2a'/><text x='32' y='42' font-family='Arial' font-size='36' font-weight='bold' fill='%23fff' text-anchor='middle'>₱</text></svg>">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f1f5f9; color: #1e293b; }
    header { background: #0b2447; color: #fff; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    header .who { font-size: 14px; }
    header .who b { display: block; font-size: 16px; }
    .logout { background: rgba(255,255,255,.12); color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .hdr-right { display: flex; align-items: center; gap: 10px; }
    .bell { position: relative; background: rgba(255,255,255,.12); color: #fff; border: none; width: 38px; height: 38px; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .bell-badge { position: absolute; top: -5px; right: -5px; background: #e11d2a; color: #fff; font-size: 10px; font-weight: 700; min-width: 17px; height: 17px; border-radius: 9px; padding: 0 4px; display: flex; align-items: center; justify-content: center; }
    .npanel { position: fixed; right: 14px; top: 60px; width: 340px; max-width: calc(100vw - 28px); background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.22); z-index: 50; overflow: hidden; display: none; }
    .npanel.open { display: block; }
    .npanel h3 { margin: 0; font-size: 14px; padding: 12px 14px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
    .npanel h3 a { text-decoration: none; }
    .nitem { padding: 10px 14px; border-bottom: 1px solid #f1f5f9; }
    .nitem.unread { background: #eff6ff; }
    .nitem b { font-size: 13px; display: block; }
    .nitem p { margin: 2px 0 0; font-size: 12px; color: #475569; }
    .nitem .nt { font-size: 10px; color: #94a3b8; margin-top: 2px; }
    .ntoast { position: fixed; right: 16px; bottom: 16px; background: #0b2447; color: #fff; padding: 12px 16px; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.3); font-size: 13px; max-width: 300px; z-index: 100; animation: nfade .3s ease; }
    @keyframes nfade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    nav.tabs { display: flex; gap: 4px; background: #0e2138; padding: 0 10px; overflow-x: auto; }
    nav.tabs a { color: #cbd5e1; padding: 12px 16px; text-decoration: none; font-weight: 600; font-size: 14px; white-space: nowrap; }
    nav.tabs a.active { color: #fff; box-shadow: inset 0 -3px 0 #e11d2a; }
    main { max-width: 900px; margin: 0 auto; padding: 18px; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.05); margin-bottom: 16px; }
    .card h2 { margin: 0; font-size: 16px; padding: 14px 16px; border-bottom: 1px solid #e2e8f0; }
    .card .in { padding: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #e2e8f0; text-align: left; }
    th { background: #f8fafc; color: #64748b; font-size: 12px; }
    .num { text-align: right; }
    input, select, textarea { padding: 8px 10px; border: 1px solid #e2e8f0; border-radius: 7px; font-size: 13px; font-family: inherit; }
    label { font-size: 12px; color: #64748b; font-weight: 600; display: block; margin-bottom: 4px; }
    .btn { background: #17408b; color: #fff; border: none; padding: 9px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 14px; }
    .btn.sm { padding: 5px 10px; font-size: 12px; }
    .btn.ghost { background: #f1f5f9; color: #1e293b; border: 1px solid #e2e8f0; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
    .kv td:first-child { color: #64748b; width: 42%; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
    .badge.pending { background: #fef3c7; color: #b45309; }
    .badge.approved { background: #dcfce7; color: #15803d; }
    .badge.rejected { background: #fee2e2; color: #b91c1c; }
    .muted { color: #94a3b8; }
    .msg { font-size: 13px; margin-top: 10px; }
    .msg.ok { color: #15803d; } .msg.err { color: #b91c1c; }
    .scroll { overflow-x: auto; }
    /* Leave calendar */
    .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .cal-head b { font-size: 15px; }
    .cal-nav { background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 7px; padding: 4px 12px; cursor: pointer; font-size: 16px; font-weight: 700; }
    .cal-nav:disabled { opacity: .4; cursor: not-allowed; }
    .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal .dow { text-align: center; font-size: 11px; color: #94a3b8; font-weight: 700; padding: 4px 0; }
    .cal .cell { aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 13px; border: 1px solid transparent; }
    .cal .cell.day { background: #f8fafc; border-color: #e2e8f0; cursor: pointer; }
    .cal .cell.day:hover { border-color: #2563eb; }
    .cal .cell.disabled { color: #cbd5e1; background: #fff; cursor: not-allowed; }
    .cal .cell.sel { background: #17408b; color: #fff; border-color: #17408b; font-weight: 700; }
    .cal .cell.today { box-shadow: inset 0 0 0 2px #f59e0b; }
    .cal .cell.empty { background: transparent; }
    .legend { font-size: 12px; color: #64748b; margin: 8px 0; }
    @media(max-width:640px){
      .grid2 { grid-template-columns: 1fr; }
      header { padding: 12px 14px; }
      header .who b { font-size: 15px; }
      main { padding: 12px; }
      .card .in { padding: 12px; }
      .npanel { top: 56px; right: 8px; }
      .cal .cell { font-size: 12px; }
      table { font-size: 12px; }
      th, td { padding: 6px 7px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="who"><b id="whoName">—</b><span id="whoMeta" class="muted"></span></div>
    <div class="hdr-right">
      <button class="bell" id="bell" aria-label="Notifications" title="Notifications">🔔<span class="bell-badge" id="bellBadge" hidden>0</span></button>
      <button class="logout" id="logout">Log out</button>
    </div>
  </header>
  <div class="npanel" id="npanel">
    <h3>Notifications <a href="#" id="nMarkAll" style="font-size:12px;color:#17408b">Mark all read</a></h3>
    <div id="nList" style="max-height:60vh;overflow:auto"></div>
  </div>
  <nav class="tabs">
    <a href="#" class="active" data-tab="profile">My 201</a>
    <a href="#" data-tab="bulletin">Bulletin</a>
    <a href="#" data-tab="dtr">My DTR</a>
    <a href="#" data-tab="schedule">My Schedule</a>
    <a href="#" data-tab="leave">File Leave</a>
    <a href="#" data-tab="teamcal">Team Calendar</a>
    <a href="#" data-tab="overtime">Overtime</a>
    <a href="#" data-tab="loans">Loans</a>
    <a href="#" data-tab="payslips">My Payslips</a>
    <a href="#" data-tab="documents">Documents</a>
    <a href="#" data-tab="security">Security</a>
  </nav>
  <main id="view"></main>

  <script>
    var peso = function (n) { return '₱' + (Number(n) || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
    var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); };
    var state = { profile: null };

    function api(url, opts) {
      return fetch(url, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts || {}))
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, status: r.status, body: j }; }); });
    }
    document.getElementById('logout').addEventListener('click', function () {
      api('/api/auth/logout', { method: 'POST' }).then(function () { location.href = '/'; });
    });

    // ---- Notifications ----
    var notif = { unread: 0, items: [], started: false };
    function timeAgo(s) {
      var d = new Date((s || '').replace(' ', 'T') + 'Z'), diff = (Date.now() - d.getTime()) / 1000;
      if (isNaN(diff)) return '';
      if (diff < 60) return 'just now';
      if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
      if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
      return Math.floor(diff / 86400) + 'd ago';
    }
    var NICON = { payslip: '💵', leave: '🌴', loan: '💳', overtime: '⏱️' };
    function renderNotifPanel() {
      var el = document.getElementById('nList');
      el.innerHTML = notif.items.length ? notif.items.map(function (n) {
        return '<div class="nitem ' + (n.is_read ? '' : 'unread') + '"><b>' + (NICON[n.type] || '🔔') + ' ' + esc(n.title) + '</b>' +
          '<p>' + esc(n.body) + '</p><div class="nt">' + timeAgo(n.created_at) + '</div></div>';
      }).join('') : '<p class="muted" style="padding:14px">No notifications yet.</p>';
    }
    function setBadge(n) {
      var b = document.getElementById('bellBadge');
      if (n > 0) { b.textContent = n > 99 ? '99+' : n; b.hidden = false; } else { b.hidden = true; }
    }
    function toast(text) {
      var t = document.createElement('div'); t.className = 'ntoast'; t.textContent = text;
      document.body.appendChild(t); setTimeout(function () { t.remove(); }, 5000);
    }
    function pollNotifs() {
      api('/api/me/notifications').then(function (r) {
        if (!r.ok) return;
        var prev = notif.unread;
        notif.items = r.body.items || []; notif.unread = r.body.unread || 0;
        setBadge(notif.unread);
        if (notif.started && notif.unread > prev && notif.items[0]) toast(notif.items[0].title + ' — ' + notif.items[0].body);
        notif.started = true;
        if (document.getElementById('npanel').classList.contains('open')) renderNotifPanel();
      });
    }
    document.getElementById('bell').addEventListener('click', function (e) {
      e.stopPropagation();
      var p = document.getElementById('npanel');
      var opening = !p.classList.contains('open');
      p.classList.toggle('open', opening);
      if (opening) {
        renderNotifPanel();
        if (notif.unread > 0) api('/api/me/notifications/read', { method: 'POST', body: '{}' }).then(function () { notif.unread = 0; setBadge(0); notif.items.forEach(function (n) { n.is_read = 1; }); });
      }
    });
    document.getElementById('nMarkAll').addEventListener('click', function (e) {
      e.preventDefault();
      api('/api/me/notifications/read', { method: 'POST', body: '{}' }).then(function () { notif.unread = 0; setBadge(0); notif.items.forEach(function (n) { n.is_read = 1; }); renderNotifPanel(); });
    });
    document.addEventListener('click', function (e) {
      var p = document.getElementById('npanel');
      if (p.classList.contains('open') && !p.contains(e.target) && e.target.id !== 'bell') p.classList.remove('open');
    });
    // Event-delegated tabs (so supervisor tabs added at runtime work too).
    document.querySelector('nav.tabs').addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[data-tab]');
      if (!a) return; e.preventDefault(); go(a.dataset.tab);
    });
    function go(tab) {
      document.querySelectorAll('nav.tabs a').forEach(function (a) { a.classList.toggle('active', a.dataset.tab === tab); });
      ({ profile: viewProfile, dtr: viewDTR, leave: viewLeave, teamcal: viewTeamCal, overtime: viewOvertime, loans: viewLoans,
         schedule: viewSchedule, bulletin: viewBulletin, payslips: viewPayslips, documents: viewDocuments, security: viewSecurity, teamdtr: viewTeamDtr, approvals: viewApprovals })[tab]();
    }

    // ---- bootstrap ----
    api('/api/auth/me').then(function (me) {
      if (!me.body.user) { location.href = '/'; return; }
      if (me.body.user.mustChangePassword) { location.href = '/'; return; } // set a new password first
      var role = me.body.user.role;
      if (role !== 'employee' && role !== 'supervisor') { location.href = '/app'; return; }
      state.role = role;
      state.isSupervisor = role === 'supervisor';
      state.canPostBulletin = ['superadmin', 'admin_payroll', 'supervisor'].indexOf(role) >= 0;
      // Supervisors get extra tabs: view-only team DTR + approvals.
      if (state.isSupervisor) {
        var nav = document.querySelector('nav.tabs');
        nav.insertAdjacentHTML('beforeend',
          '<a href="#" data-tab="teamdtr">Team DTR</a><a href="#" data-tab="approvals">Approvals</a>');
      }
      return api('/api/me/profile').then(function (p) {
        state.profile = p.body;
        document.getElementById('whoName').textContent = p.body.user.fullName || p.body.user.email;
        var emp = p.body.employee;
        var supTag = state.isSupervisor ? ' • Supervisor' : '';
        document.getElementById('whoMeta').textContent = (emp ? (emp.position || '') + (emp.code ? ' • ' + emp.code : '') : 'Awaiting 201 link') + supTag;
        go('profile');
        pollNotifs();
        setInterval(pollNotifs, 45000);
        showBulletinPopup();
      });
    });

    // ---- Security: authenticator-app (2FA) for password reset ----
    function viewSecurity() {
      var v = document.getElementById('view');
      v.innerHTML = '<div class="card"><h2>Security</h2><div class="in" id="secBody">Loading…</div></div>';
      api('/api/me/2fa/status').then(function (r) { renderSecurity(!!(r.body && r.body.enabled)); });
    }
    function renderSecurity(enabled) {
      var b = document.getElementById('secBody');
      b.innerHTML =
        '<p class="muted">Set up an <b>authenticator app</b> (Google Authenticator, Microsoft Authenticator, Authy…). ' +
        'Once enabled, you can reset your own password from the sign-in screen using the 6-digit code — no email needed.</p>' +
        '<p>Authenticator status: <b style="color:' + (enabled ? '#0a7d33' : '#b00020') + '">' + (enabled ? 'Enabled' : 'Not set up') + '</b></p>' +
        (enabled
          ? '<label>Enter a current 6-digit code to turn it off</label>' +
            '<input id="secCode" inputmode="numeric" maxlength="6" placeholder="123456" style="max-width:180px">' +
            '<button class="btn" id="secDisable" style="margin-top:8px;background:#b00020">Turn Off Authenticator</button>'
          : '<button class="btn" id="secSetup">Set Up Authenticator</button>') +
        '<div id="secMsg" class="msg"></div><div id="secSetupArea" style="margin-top:12px"></div>';
      if (enabled) {
        document.getElementById('secDisable').addEventListener('click', function () {
          var code = (document.getElementById('secCode').value || '').replace(/\s+/g, '');
          api('/api/me/2fa/disable', { method: 'POST', body: JSON.stringify({ code: code }) }).then(function (r) {
            var m = document.getElementById('secMsg');
            if (!r.ok) { m.textContent = '  ' + (r.body.error || 'Could not turn off.'); m.className = 'msg err'; return; }
            renderSecurity(false);
          });
        });
      } else {
        document.getElementById('secSetup').addEventListener('click', beginSecuritySetup);
      }
    }
    function beginSecuritySetup() {
      api('/api/me/2fa/setup', { method: 'POST', body: '{}' }).then(function (r) {
        if (!r.ok) return;
        var s = r.body.secret, uri = r.body.otpauthUrl;
        document.getElementById('secSetupArea').innerHTML =
          '<div class="card" style="background:#f8fafc"><div class="in">' +
          '<p><b>1.</b> In your authenticator app, add an account and enter this setup key:</p>' +
          '<p style="font-family:monospace;font-size:18px;letter-spacing:2px;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:10px;word-break:break-all">' + esc(s) + '</p>' +
          '<p style="font-size:13px"><a href="' + esc(uri) + '">Tap here to add it automatically</a> (works if an authenticator app is installed on this device).</p>' +
          '<p><b>2.</b> Enter the 6-digit code it shows to confirm:</p>' +
          '<input id="secVerify" inputmode="numeric" maxlength="6" placeholder="123456" style="max-width:180px">' +
          '<button class="btn" id="secConfirm" style="margin-top:8px">Confirm &amp; Enable</button>' +
          '<div id="secVerifyMsg" class="msg"></div></div></div>';
        document.getElementById('secConfirm').addEventListener('click', function () {
          var code = (document.getElementById('secVerify').value || '').replace(/\s+/g, '');
          api('/api/me/2fa/verify', { method: 'POST', body: JSON.stringify({ code: code }) }).then(function (r2) {
            var m = document.getElementById('secVerifyMsg');
            if (!r2.ok) { m.textContent = '  ' + (r2.body.error || 'Incorrect code.'); m.className = 'msg err'; return; }
            renderSecurity(true);
          });
        });
      });
    }

    // ---- My 201 ----
    function viewProfile() {
      var emp = state.profile.employee;
      var src = emp || state.profile.profile || {};
      function row(l, v) { return '<tr class="kv"><td>' + l + '</td><td>' + esc(v || '—') + '</td></tr>'; }
      var body = !emp
        ? '<p class="muted">Your account is not yet linked to an employee record. Some details you entered at sign-up are shown below; an administrator will finalize your 201 file.</p>'
        : '';
      var pc = state.profile.pendingProfileChange;
      if (pc && pc.fields) {
        var LBL = { bankName: 'Bank', bankAccountName: 'Account Name', bankAccountNumber: 'Account No.', sssNo: 'SSS No.', philhealthNo: 'PhilHealth No.', pagibigNo: 'Pag-IBIG No.', tin: 'TIN' };
        body += '<div style="background:#fef3c7;border:1px solid #fde68a;border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:13px">' +
          '⏳ <b>Pending admin approval:</b> ' + Object.keys(pc.fields).map(function (k) { return esc((LBL[k] || k) + ' → ' + pc.fields[k]); }).join(', ') +
          '<div class="muted" style="font-size:11px">Your bank / government-ID change is awaiting approval. The values above will show once approved.</div></div>';
      }
      var pcb = Date.now();
      var photoBlock =
        '<div style="display:flex;gap:16px;align-items:center;margin-bottom:14px">' +
        '<div style="width:96px;height:96px;border-radius:50%;overflow:hidden;border:2px solid #e2e8f0;background:#f1f5f9;flex:none;position:relative">' +
        '<img id="myPhoto" src="/api/me/photo?t=' + pcb + '" style="width:100%;height:100%;object-fit:cover" ' +
        'onload="this.style.display=\'block\';document.getElementById(\'photoInit\').style.display=\'none\'" ' +
        'onerror="this.style.display=\'none\'">' +
        '<div id="photoInit" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;color:#94a3b8">👤</div>' +
        '</div>' +
        '<div><input type="file" id="photoFile" accept="image/*" capture="user" style="display:none">' +
        '<button class="btn sm" id="photoBtn">Upload / Change Photo</button> ' +
        '<button class="btn sm ghost" id="photoDel">Remove</button>' +
        '<div class="muted" style="font-size:11px;margin-top:4px">A clear, recent headshot (JPG/PNG).</div>' +
        '<span id="photoMsg" class="msg"></span></div></div>';
      document.getElementById('view').innerHTML =
        '<div class="card"><h2>My 201 File <button class="btn sm" id="edit201" style="float:right">Edit My Details</button></h2><div class="in">' + body + photoBlock +
        '<div class="grid2"><table>' +
        row('Name', ((src.lastName || '') + ', ' + (src.firstName || '') + ' ' + (src.middleName || '')).trim()) +
        row('Position', src.position) + row('Department', src.department) +
        row('Date Hired', src.hireDate) + row('Employment Status', src.employmentStatus) +
        row('Civil Status', src.civilStatus) +
        row('Contact', src.contactNumber) + row('Email', src.email) + row('Address', src.address) +
        row('Emergency Contact', [src.emergencyName, src.emergencyRelation, src.emergencyContact].filter(Boolean).join(' • ')) +
        '</table><table>' +
        row('SSS No.', src.sssNo) + row('PhilHealth No.', src.philhealthNo) +
        row('Pag-IBIG No.', src.pagibigNo) + row('TIN', src.tin) +
        row('Bank', src.bankName) + row('Account Name', src.bankAccountName) + row('Account No.', src.bankAccountNumber) +
        '</table></div></div></div>';
      document.getElementById('edit201').addEventListener('click', editProfile);
      var pBtn = document.getElementById('photoBtn'), pFile = document.getElementById('photoFile'), pMsg = document.getElementById('photoMsg');
      pBtn.addEventListener('click', function () { pFile.click(); });
      pFile.addEventListener('change', function () {
        var f = pFile.files[0]; if (!f) return;
        pMsg.textContent = '  Uploading…'; pMsg.className = 'msg';
        tcCompress(f).then(function (dataUrl) {
          return api('/api/me/photo', { method: 'POST', body: JSON.stringify({ dataUrl: dataUrl }) });
        }).then(function (r) {
          if (!r.ok) { pMsg.textContent = '  ' + (r.body.error || 'Upload failed.'); pMsg.className = 'msg err'; return; }
          pMsg.textContent = ''; document.getElementById('myPhoto').src = '/api/me/photo?t=' + Date.now();
          document.getElementById('myPhoto').style.display = 'block';
        }).catch(function () { pMsg.textContent = '  Could not read that image.'; pMsg.className = 'msg err'; });
      });
      document.getElementById('photoDel').addEventListener('click', function () {
        if (!confirm('Remove your profile photo?')) return;
        api('/api/me/photo', { method: 'DELETE' }).then(function () {
          var img = document.getElementById('myPhoto'); img.style.display = 'none';
          document.getElementById('photoInit').style.display = 'flex';
        });
      });
    }
    function editProfile() {
      var src = state.profile.employee || state.profile.profile || {};
      function fld(name, label, type) {
        return '<label>' + label + '</label><input name="' + name + '"' + (type ? ' type="' + type + '"' : '') +
          ' value="' + esc(src[name] || '') + '" style="width:100%;max-width:340px">';
      }
      document.getElementById('view').innerHTML =
        '<div class="card"><h2>Edit My Details</h2><div class="in">' +
        '<p class="muted">Contact details are saved right away. <b>Bank details and government IDs require admin approval</b> — they take effect once approved. Pay, position and schedule are maintained by your administrator.</p>' +
        '<form id="p201Form">' +
        '<div class="section-title" style="font-weight:700;color:#17408b;margin:6px 0">Contact Details</div>' +
        '<div class="grid2">' +
        '<div>' + fld('contactNumber', 'Contact Number') + '</div>' +

    // ---- My DTR ----
    function pad2(n) { return (n < 10 ? '0' : '') + n; }
    function coverageDays(period, restDow) {
      var out = []; var s = new Date(period.startDate + 'T00:00:00'), e = new Date(period.endDate + 'T00:00:00');
      if (isNaN(s) || isNaN(e)) return out;
      var g = 0;
      for (var d = new Date(s); d <= e && g < 400; d.setDate(d.getDate() + 1), g++) {
        out.push({ date: d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()), restDay: d.getDay() === restDow });
      }
      return out;
    }

    // ---- Physical time card uploads ----
    function tcCompress(file) {
      // Images are downscaled to a JPEG to keep uploads small; PDFs pass through.
      return new Promise(function (resolve, reject) {
        var fr = new FileReader();
        fr.onerror = reject;
        if (file.type === 'application/pdf') { fr.onload = function () { resolve(fr.result); }; fr.readAsDataURL(file); return; }
        fr.onload = function () {
          var img = new Image();
          img.onerror = reject;
          img.onload = function () {
            var maxD = 1600, w = img.width, h = img.height;
            if (w > h && w > maxD) { h = Math.round(h * maxD / w); w = maxD; }
            else if (h > maxD) { w = Math.round(w * maxD / h); h = maxD; }
            var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
            cv.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(cv.toDataURL('image/jpeg', 0.75));
          };
          img.src = fr.result;
        };
        fr.readAsDataURL(file);
      });
    }

    // ---- File Leave (calendar) ----
    // Shared window rule — MUST mirror server/src/index.js leaveDateAllowed().
    function ymIndex(y, m) { return y * 12 + m; }
    function leaveAllowed(dateObj, type, win, todayObj) {
      var openDay = Number(win.openDay) || 21, manualOpen = !!win.manualOpen;
      var d0 = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
      if (type === 'VL' && d0 < todayObj) return false;               // no backdated vacation
      var md = ymIndex(d0.getFullYear(), d0.getMonth()) - ymIndex(todayObj.getFullYear(), todayObj.getMonth());
      if (md <= -1) return type === 'SL' || type === 'EL' || type === 'UAL'; // backdated sick/emergency/unpaid only
      if (md === 0) return true;                                       // current month
      if (md === 1) return manualOpen || todayObj.getDate() >= openDay;
      return manualOpen;                                               // 2+ months ahead
    }
    var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    var DOW_FULL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

      var p = iso.split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2] + n);
      return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
    }
    function fmtDay(iso) { var p = iso.split('-'); return +p[2] + ' ' + MONTHS[+p[1] - 1].slice(0, 3); }
    function todayISO() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
    function viewSchedule() {

    function drawSchedule(b) {

          '<td>' + DOW_FULL[d.weekday] + (isToday ? ' <span class="badge" style="background:#2563eb;color:#fff">Today</span>' : '') + '</td>' +
          '<td class="muted">' + fmtDay(d.date) + '</td><td>' + when + '</td></tr>';

    var leaveState = { month: null, sel: {}, win: { openDay: 21, manualOpen: false }, today: new Date(), creditsRemaining: 0 };

    // Sick / Emergency leave can carry a supporting document (medical certificate

    // When paid-leave credits are exhausted, disable VL/SL/EL and steer the

    function renderCal() {
      var m = leaveState.month, type = document.getElementById('lType').value;
      var win = leaveState.win, today = leaveState.today;
      var first = new Date(m.getFullYear(), m.getMonth(), 1);
      var daysIn = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
      // Disable going before the current month.
      var atMinMonth = (m.getFullYear() === today.getFullYear() && m.getMonth() === today.getMonth());
      var cells = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function (d) { return '<div class="dow">' + d + '</div>'; });
      for (var i = 0; i < first.getDay(); i++) cells.push('<div class="cell empty"></div>');
      for (var day = 1; day <= daysIn; day++) {
        var dObj = new Date(m.getFullYear(), m.getMonth(), day);
        var iso = dObj.getFullYear() + '-' + pad2(dObj.getMonth() + 1) + '-' + pad2(dObj.getDate());
        var ok = leaveAllowed(dObj, type, win, today);
        var isToday = (dObj.getTime() === today.getTime());
        var cls = 'cell ' + (ok ? 'day' : 'disabled') + (leaveState.sel[iso] ? ' sel' : '') + (isToday ? ' today' : '');
        cells.push('<div class="' + cls + '"' + (ok ? ' data-iso="' + iso + '"' : '') + '>' + day + '</div>');
      }
      document.getElementById('calWrap').innerHTML =
        '<div class="cal-head"><button class="cal-nav" id="calPrev"' + (atMinMonth ? ' disabled' : '') + '>‹</button>' +
        '<b>' + MONTHS[m.getMonth()] + ' ' + m.getFullYear() + '</b>' +
        '<button class="cal-nav" id="calNext">›</button></div>' +
        '<div class="cal">' + cells.join('') + '</div>';
      var openInfo = win.manualOpen ? 'Filing is currently open for future months.'
        : 'Next-month leave opens on day ' + (win.openDay || 21) + ' of the current month. Sick / Emergency / Unpaid Authorized leave can be filed anytime.';
      document.getElementById('calNote').textContent = openInfo;
      var prev = document.getElementById('calPrev'), next = document.getElementById('calNext');
      if (prev) prev.onclick = function () { leaveState.month = new Date(m.getFullYear(), m.getMonth() - 1, 1); renderCal(); };
      next.onclick = function () { leaveState.month = new Date(m.getFullYear(), m.getMonth() + 1, 1); renderCal(); };
      document.querySelectorAll('#calWrap .cell.day').forEach(function (c) {
        c.onclick = function () { var iso = c.dataset.iso; if (leaveState.sel[iso]) delete leaveState.sel[iso]; else leaveState.sel[iso] = true; renderCal(); updateSel(); };
      });

    function selectedDates() { return Object.keys(leaveState.sel).sort(); }
    function updateSel() {
      var d = selectedDates();
      document.getElementById('selSummary').textContent = d.length ? ('Selected: ' + d.length + ' day' + (d.length > 1 ? 's' : '') + ' (' + d[0] + (d.length > 1 ? ' … ' + d[d.length - 1] : '') + ')') : 'Tap the days you want off.';
    }
    // Group selected ISO dates into contiguous ranges.
    function contiguousRanges(dates) {
      var ranges = [], start = null, prev = null;
      dates.forEach(function (iso) {
        var d = new Date(iso + 'T00:00:00');
        if (start === null) { start = iso; prev = d; return; }
        var gap = (d - prev) / 86400000;
        if (gap === 1) { prev = d; return; }
        ranges.push([start, prev.getFullYear() + '-' + pad2(prev.getMonth() + 1) + '-' + pad2(prev.getDate())]);
        start = iso; prev = d;
      });
      if (start !== null) ranges.push([start, prev.getFullYear() + '-' + pad2(prev.getMonth() + 1) + '-' + pad2(prev.getDate())]);
      return ranges;
    }
    function submitLeave() {
      var m = document.getElementById('lMsg'), type = document.getElementById('lType').value;

      var btn = document.getElementById('lSubmit'); btn.disabled = true;
      Promise.all(ranges.map(function (rg) {
        return api('/api/me/leave', { method: 'POST', body: JSON.stringify({ dateFrom: rg[0], dateTo: rg[1], leaveType: type, reason: reason }) });
      })).then(function (results) {
        var bad = results.filter(function (r) { return !r.ok; });
        // Attach the supporting document to the first successfully created request.
        var firstOk = results.filter(function (r) { return r.ok && r.body && r.body.id; })[0];
        if (!attachFile || !firstOk) return { bad: bad };
        return tcCompress(attachFile).then(function (dataUrl) {
          return api('/api/me/documents', { method: 'POST', body: JSON.stringify({
            category: type === 'SL' ? 'med_cert' : 'el_proof',
            title: (type === 'SL' ? 'Medical Certificate' : 'EL Proof') + ' — ' + ranges[0][0],
            dataUrl: dataUrl, leaveRequestId: firstOk.body.id }) });
        }).then(function (dr) { return { bad: bad, docFailed: !dr.ok }; }).catch(function () { return { bad: bad, docFailed: true }; });
      }).then(function (res) {
        btn.disabled = false;
        var bad = res.bad;
        if (bad.length) { m.textContent = '  ' + (bad[0].body.error || 'Some requests failed.'); m.className = 'msg err'; }
        else {
          m.textContent = '  ✓ ' + ranges.length + ' request' + (ranges.length > 1 ? 's' : '') + ' submitted' +
            (res.docFailed ? ' (but the attachment could not be saved — please add it from the Documents tab)' : (attachFile ? ' with attachment' : ''));
          m.className = res.docFailed ? 'msg err' : 'msg ok';

    // ---- Team Calendar (shared, approved leaves of your branch) ----
    var TC_COLORS = { SL: '#2563eb', VL: '#0a7d33', EL: '#d97706', UAL: '#6b7280', '': '#334155' };
    var teamCal = { month: null, rows: [] };
    function viewTeamCal() {

    function drawTeamCal() {
      var m = teamCal.month, rows = teamCal.rows, y = m.getFullYear(), mo = m.getMonth();
      var first = new Date(y, mo, 1), daysIn = new Date(y, mo + 1, 0).getDate();
      var cells = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function (d) {
        return '<div style="text-align:center;font-size:11px;color:#94a3b8;font-weight:700;padding:4px 0">' + d + '</div>';
      });
      for (var i = 0; i < first.getDay(); i++) cells.push('<div></div>');
      for (var day = 1; day <= daysIn; day++) {
        var iso = y + '-' + pad2(mo + 1) + '-' + pad2(day);
        var on = rows.filter(function (r) { return r.date_from <= iso && iso <= r.date_to; });
        var chips = on.map(function (r) {
          var c = TC_COLORS[r.leave_type] || TC_COLORS[''];
          return '<div title="' + esc((r.full_name || '') + ' — ' + r.leave_type) + '" style="font-size:10px;line-height:1.3;margin-top:2px;padding:1px 4px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;background:' + c + '">' +
            esc((r.full_name || '').split(' ')[0]) + ' · ' + esc(r.leave_type) + '</div>';
        }).join('');
        cells.push('<div style="min-height:66px;border:1px solid #e2e8f0;border-radius:6px;padding:3px;background:' + (on.length ? '#f8fafc' : '#fff') + '">' +
          '<div style="font-size:11px;color:#64748b;font-weight:600">' + day + '</div>' + chips + '</div>');

    }
    function payslipDoc(x) {
      return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Payslip ' + esc(x.period.name) + '</title>' +
        '<style>body{margin:16px;background:#fff}' + PSLIP_CSS + '</style></head><body>' + payslipInner(x) + '</body></html>';
    }
    function printPayslip(x) {
      var html = payslipDoc(x);
      // Native Android print when running inside the app; browser print otherwise.
      if (window.AndroidBridge && window.AndroidBridge.printHtml) {
        window.AndroidBridge.printHtml('Payslip ' + x.period.name, btoa(unescape(encodeURIComponent(html))));
        return;
      }
      var w = window.open('', '_blank');
      if (!w) { window.print(); return; }
      w.document.write(html); w.document.close(); w.focus();
      setTimeout(function () { w.print(); }, 300);
    }
    function showSlip(x) {
      document.getElementById('slipView').innerHTML =
        '<div class="card"><div class="in" style="overflow:auto">' +
        '<style>' + PSLIP_CSS + '</style>' + payslipInner(x) +
        '<div id="ackBox" style="margin-top:14px"></div>' +
        '<div style="margin-top:12px;text-align:right"><button class="btn" id="slipPrint">Print / Save PDF</button></div>' +
        '</div></div>';
      document.getElementById('slipPrint').addEventListener('click', function () { printPayslip(x); });
      renderAckBox(x);
      document.getElementById('slipView').scrollIntoView({ behavior: 'smooth' });
    }
    // Accept / Dispute sign-off on the payslip. Accept records a typed name;
    // Dispute records a reason (and alerts payroll). Shows the recorded state
    // once acted, with a link to change the response.
    function renderAckBox(x, forceForm) {
      var box = document.getElementById('ackBox'); if (!box) return;
      var a = x.ack;
      if (a && a.status && !forceForm) {
        var when = String(a.at || '').replace('T', ' ').slice(0, 16);
        if (a.status === 'accepted') {
          box.innerHTML = '<div style="border:1px solid #0a7d33;background:#e9f9ee;color:#0a5a26;border-radius:8px;padding:10px 12px">' +
            '✔ <b>Payslip accepted</b> — acknowledged by <b>' + esc(a.signedName || '') + '</b>' + (when ? ' on ' + esc(when) : '') + '. ' +
            '<a href="#" id="ackChange" style="margin-left:6px">Change response</a></div>';
        } else {
          box.innerHTML = '<div style="border:1px solid #b00020;background:#fdecee;color:#8a0016;border-radius:8px;padding:10px 12px">' +
            '⚑ <b>Payslip disputed</b>' + (when ? ' on ' + esc(when) : '') + '.<br><span class="muted">Reason:</span> ' + esc(a.disputeReason || '') + ' ' +
            '<a href="#" id="ackChange" style="margin-left:6px">Update response</a></div>';
        }
        var ch = document.getElementById('ackChange');
        if (ch) ch.addEventListener('click', function (e) { e.preventDefault(); renderAckBox(x, true); });
        return;
      }
      box.innerHTML =
        '<div style="border:1px solid #d9dee7;border-radius:8px;padding:12px">' +
        '<div style="font-weight:600;margin-bottom:8px">Payslip acknowledgement</div>' +
        '<p class="muted" style="margin:0 0 8px">Please review your payslip, then accept it or raise a dispute.</p>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">' +
        '<button class="btn" id="ackAcceptBtn" style="background:#0a7d33">✔ Accept</button>' +
        '<button class="btn" id="ackDisputeBtn" style="background:#b00020">⚑ Dispute</button></div>' +
        '<div id="ackAcceptForm" style="display:none">' +
        '<label style="font-size:13px">Type your full name to acknowledge this payslip:</label>' +
        '<input id="ackName" type="text" placeholder="Full name" style="width:100%;margin:4px 0 8px;padding:6px;box-sizing:border-box">' +
        '<button class="btn sm" id="ackAcceptSubmit">Confirm acceptance</button></div>' +
        '<div id="ackDisputeForm" style="display:none">' +
        '<label style="font-size:13px">Describe the reason for your dispute:</label>' +
        '<textarea id="ackReason" rows="4" placeholder="What is incorrect on this payslip?" style="width:100%;margin:4px 0 8px;padding:6px;box-sizing:border-box"></textarea>' +
        '<button class="btn sm" id="ackDisputeSubmit">Submit dispute</button></div>' +
        '</div>';
      document.getElementById('ackAcceptBtn').addEventListener('click', function () {
        document.getElementById('ackAcceptForm').style.display = 'block';
        document.getElementById('ackDisputeForm').style.display = 'none';
      });
      document.getElementById('ackDisputeBtn').addEventListener('click', function () {
        document.getElementById('ackDisputeForm').style.display = 'block';
        document.getElementById('ackAcceptForm').style.display = 'none';
      });
      document.getElementById('ackAcceptSubmit').addEventListener('click', function () {
        var name = (document.getElementById('ackName').value || '').trim();
        if (!name) { alert('Please type your full name to acknowledge the payslip.'); return; }
        submitAck(x, 'accepted', { signedName: name });
      });
      document.getElementById('ackDisputeSubmit').addEventListener('click', function () {
        var reason = (document.getElementById('ackReason').value || '').trim();
        if (!reason) { alert('Please describe the reason for your dispute.'); return; }
        submitAck(x, 'disputed', { disputeReason: reason });
      });
    }
    function submitAck(x, status, extra) {
      var payload = Object.assign({ periodId: x.period.id, status: status }, extra);
      api('/api/me/payslip-ack', { method: 'POST', body: JSON.stringify(payload) }).then(function (r) {
        if (!r.ok || (r.body && r.body.error)) { alert((r.body && r.body.error) || 'Could not save your response.'); return; }
        x.ack = { status: status, signedName: extra.signedName || '', disputeReason: extra.disputeReason || '', at: new Date().toISOString() };
        renderAckBox(x);
      });
    }

    // ---- My Documents ----
    var DOC_UP_CATS = [['med_cert', 'Medical Certificate'], ['el_proof', 'Emergency Leave Proof'], ['other', 'Other Document']];
    function viewDocuments() {
      document.getElementById('view').innerHTML =
        '<div class="card"><h2>Upload a Document</h2><div class="in">' +
        '<p class="muted">Upload a medical certificate (for sick leave), proof for an emergency leave, or any other document your HR / payroll may need. JPG, PNG or PDF, up to ~5 MB.</p>' +
        '<div class="grid2">' +
        '<div><label>Document type</label><select id="dCat">' + DOC_UP_CATS.map(function (c) { return '<option value="' + c[0] + '">' + c[1] + '</option>'; }).join('') + '</select></div>' +
        '<div><label>Title / description</label><input id="dTitle" style="width:100%" placeholder="e.g. Med cert Aug 6-8"></div>' +
        '</div>' +
        '<label style="margin-top:8px">File</label><input type="file" id="dFile" accept="image/*,application/pdf"><br>' +
        '<button class="btn" id="dUpload" style="margin-top:10px">Upload</button><span id="dMsg" class="msg"></span>' +
        '</div></div>' +
        '<div class="card"><h2>My Documents</h2><div class="in scroll" id="dList">Loading…</div></div>' +
        '<div class="card"><h2>Issued by HR / Admin</h2><div class="in scroll" id="dHrList">Loading…</div></div>';
      document.getElementById('dUpload').addEventListener('click', uploadDocument);
      loadDocuments();
    }
    function uploadDocument() {
      var m = document.getElementById('dMsg'), f = document.getElementById('dFile').files[0];
      if (!f) { m.textContent = '  Choose a file first.'; m.className = 'msg err'; return; }
      var cat = document.getElementById('dCat').value, title = document.getElementById('dTitle').value;
      var btn = document.getElementById('dUpload'); btn.disabled = true;
      m.textContent = '  Uploading…'; m.className = 'msg';
      tcCompress(f).then(function (dataUrl) {
        return api('/api/me/documents', { method: 'POST', body: JSON.stringify({ category: cat, title: title, dataUrl: dataUrl }) });
      }).then(function (r) {
        btn.disabled = false;
        if (!r.ok) { m.textContent = '  ' + (r.body.error || 'Upload failed.'); m.className = 'msg err'; return; }
        m.textContent = '  ✓ Uploaded'; m.className = 'msg ok';
        document.getElementById('dFile').value = ''; document.getElementById('dTitle').value = '';
        loadDocuments();
      }).catch(function () { btn.disabled = false; m.textContent = '  Could not read that file.'; m.className = 'msg err'; });
    }
    function docRowsHtml(list, mine) {
      if (!list.length) return '<p class="muted">' + (mine ? 'No documents uploaded yet.' : 'No documents issued to you.') + '</p>';
      return '<table><thead><tr><th>Type</th><th>Title</th><th>Date</th><th></th></tr></thead><tbody>' +
        list.map(function (d) {
          return '<tr><td>' + esc(d.categoryLabel) + '</td><td>' + esc(d.title || '—') +
            (d.leave_request_id ? ' <span class="badge" style="background:#dbeafe;color:#1e40af">leave</span>' : '') +
            '</td><td>' + esc((d.created_at || '').slice(0, 10)) + '</td>' +
            '<td><a class="btn sm ghost" href="/api/document/' + d.id + '" target="_blank">View</a>' +
            (mine ? ' <button class="btn sm ghost" data-del="' + d.id + '">Delete</button>' : '') + '</td></tr>';
        }).join('') + '</tbody></table>';
    }
    function loadDocuments() {
      api('/api/me/documents').then(function (r) {
        var all = (r.body && r.body.documents) || [];
        var mine = all.filter(function (d) { return d.direction === 'employee'; });
        var hr = all.filter(function (d) { return d.direction === 'admin'; });
        document.getElementById('dList').innerHTML = docRowsHtml(mine, true);
        document.getElementById('dHrList').innerHTML = docRowsHtml(hr, false);
        document.querySelectorAll('#dList [data-del]').forEach(function (b) {
          b.addEventListener('click', function () {
            if (!confirm('Delete this document?')) return;
            api('/api/me/documents/' + b.dataset.del, { method: 'DELETE' }).then(loadDocuments);
          });
        });
      });
    }

    // ---- Supervisor: Team DTR (view-only) ----
    function viewTeamDtr() {
      document.getElementById('view').innerHTML =
        '<div class="card"><h2>Team DTR — view only</h2><div class="in">' +
        '<p class="muted">View any employee\'s time records for a period. Read-only — corrections are made by the payroll admin.</p>' +
        '<div class="grid2"><div><label>Employee</label><select id="tdEmp"></select></div>' +
        '<div><label>Payroll period</label><select id="tdPer"></select></div></div>' +
        '<div id="tdArea" class="scroll" style="margin-top:14px"></div></div></div>';
      Promise.all([api('/api/sup/employees'), api('/api/sup/periods')]).then(function (res) {
        var emps = (res[0].body || {}).employees || [], pers = (res[1].body || {}).periods || [];
        document.getElementById('tdEmp').innerHTML = emps.map(function (e) { return '<option value="' + e.id + '">' + esc(e.lastName + ', ' + e.firstName) + (e.code ? ' (' + esc(e.code) + ')' : '') + '</option>'; }).join('');
        document.getElementById('tdPer').innerHTML = pers.map(function (p) { return '<option value="' + p.id + '">' + esc(p.name) + '</option>'; }).join('');
        function load() {
          var eid = document.getElementById('tdEmp').value, pid = document.getElementById('tdPer').value;
          if (!eid || !pid) { document.getElementById('tdArea').innerHTML = '<p class="muted">No employees or periods yet.</p>'; return; }
          api('/api/sup/dtr/' + pid + '/' + eid).then(function (r) {
            var days = (r.body || {}).days || [];
            var rows = days.map(function (d) { return '<tr><td>' + esc(d.date || '') + '</td><td>' + esc(d.timeIn || '—') + '</td><td>' + esc(d.timeOut || '—') + '</td><td>' + esc(fmtFlag(d) || '—') + '</td></tr>'; }).join('');
            document.getElementById('tdArea').innerHTML = days.length
              ? '<table><thead><tr><th>Date</th><th>Time In</th><th>Time Out</th><th>Notes</th></tr></thead><tbody>' + rows + '</tbody></table>'
              : '<p class="muted">No time records for this period.</p>';
          });
        }
        document.getElementById('tdEmp').addEventListener('change', load);
        document.getElementById('tdPer').addEventListener('change', load);
        if (emps.length && pers.length) load(); else document.getElementById('tdArea').innerHTML = '<p class="muted">No employees or periods yet.</p>';
      });
    }

    // ---- Supervisor: Approvals (leave / overtime / product advances) ----
    function viewApprovals() {
      document.getElementById('view').innerHTML =
        '<div class="card"><h2>Approvals</h2><div class="in">' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">' +
        '<button class="btn ghost sm apv-seg" data-seg="leave">Leave</button>' +
        '<button class="btn ghost sm apv-seg" data-seg="overtime">Overtime</button>' +
        '<button class="btn ghost sm apv-seg" data-seg="wfh">WFH / Field</button>' +
        '<button class="btn ghost sm apv-seg" data-seg="loans">Product Advances</button>' +
        '</div><div id="apvArea">Loading…</div></div></div>';
      document.querySelectorAll('.apv-seg').forEach(function (b) { b.addEventListener('click', function () { apvLoad(b.dataset.seg); }); });
      apvLoad('leave');
    }
    function apvActions(x) {
      return x.status === 'pending'
        ? '<button class="btn sm" data-ok="' + x.id + '">Approve</button> <button class="btn ghost sm" data-no="' + x.id + '">Reject</button>'
        : '';
    }
    function apvBind(area, url, seg) {
      area.querySelectorAll('[data-ok]').forEach(function (b) { b.addEventListener('click', function () { apvDecide(url, b.dataset.ok, 'approved', seg); }); });
      area.querySelectorAll('[data-no]').forEach(function (b) { b.addEventListener('click', function () { apvDecide(url, b.dataset.no, 'rejected', seg); }); });
    }
    function apvDecide(url, id, decision, seg) {
      var payload = { decision: decision };
      // Declining a loan application requires a reason (shown to the employee).
      if (seg === 'loans' && decision === 'rejected') {
        var reason = prompt('Reason for declining this application (shown to the employee):', '');
        if (reason === null) return; // cancelled
        payload.reason = reason;
      }
      api(url + '/' + id, { method: 'POST', body: JSON.stringify(payload) }).then(function (r) {
        if (!r.ok) { alert(r.body.error || 'Failed'); return; } apvLoad(seg);
      });
    }
    function apvLoad(seg) {
      var area = document.getElementById('apvArea'); area.innerHTML = 'Loading…';
      if (seg === 'leave') {
        api('/api/admin/leave-requests').then(function (r) {
          var rows = (r.body.requests || []).map(function (x) {
            return '<tr><td>' + esc(x.full_name || x.email) + '</td><td>' + esc(x.date_from) + ' → ' + esc(x.date_to) + '</td><td>' + esc(x.leave_type) +
              '</td><td>' + esc(x.reason || '') + '</td><td><span class="badge ' + x.status + '">' + x.status + '</span></td><td>' + apvActions(x) + '</td></tr>';
          }).join('');
          area.innerHTML = rows ? '<div class="scroll"><table><thead><tr><th>Employee</th><th>Dates</th><th>Type</th><th>Reason</th><th>Status</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '<p class="muted">No leave requests.</p>';
          apvBind(area, '/api/admin/leave-requests', 'leave');
        });
      } else if (seg === 'overtime') {
        api('/api/admin/overtime-requests').then(function (r) {
          var rows = (r.body.requests || []).map(function (x) {
            var kind = x.ot_kind === 'before' ? 'Pre-shift' : 'After shift';
            return '<tr><td>' + esc(x.full_name || x.email) + '</td><td>' + esc(x.ot_date) + '</td><td>' + kind + '</td><td>' + esc(x.reason_label || x.reason) +
              '<div class="muted" style="font-size:11px">' + esc(x.specific_reason || '') + '</div></td><td class="num">' + (x.ot_minutes / 60).toFixed(2) +
              '</td><td><span class="badge ' + x.status + '">' + x.status + '</span></td><td>' + apvActions(x) + '</td></tr>';
          }).join('');
          area.innerHTML = rows ? '<div class="scroll"><table><thead><tr><th>Employee</th><th>Date</th><th>Type</th><th>Reason</th><th class="num">OT Hrs</th><th>Status</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '<p class="muted">No overtime requests.</p>';
          apvBind(area, '/api/admin/overtime-requests', 'overtime');
        });
      } else if (seg === 'wfh') {
        api('/api/admin/wfh-requests').then(function (r) {
          var rows = (r.body.requests || []).map(function (x) {
            var proof = '<a href="/api/wfh-file/' + x.id + '/eod" target="_blank">EOD</a> · <a href="/api/wfh-file/' + x.id + '/timein" target="_blank">in</a> · <a href="/api/wfh-file/' + x.id + '/timeout" target="_blank">out</a>';
            return '<tr><td>' + esc(x.full_name || x.employee_code || '') + '</td><td>' + esc(x.workDate) + '</td><td>' + esc(x.modeLabel) + '</td><td>' + esc(x.timeIn || '') + '–' + esc(x.timeOut || '') +
              '</td><td style="font-size:12px">' + proof + (x.eodNote ? '<div class="muted">' + esc(x.eodNote) + '</div>' : '') + '</td><td><span class="badge ' + x.status + '">' + x.status + '</span></td><td>' + apvActions(x) + '</td></tr>';
          }).join('');
          area.innerHTML = '<p class="muted">Approving credits a full 8-hour day (no tardiness/overtime). Open the EOD report and in/out photos to verify.</p>' +
            (rows ? '<div class="scroll"><table><thead><tr><th>Employee</th><th>Date</th><th>Type</th><th>Time</th><th>Proof</th><th>Status</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '<p class="muted">No WFH / Field filings.</p>');
          apvBind(area, '/api/admin/wfh-requests', 'wfh');
        });
      } else {
        api('/api/admin/loan-requests').then(function (r) {
          var rows = (r.body.requests || []).map(function (x) {
            return '<tr><td>' + esc(x.full_name || x.email) + '</td><td>' + esc(x.loan_type_label || x.loan_type) + '</td><td class="num">' + peso(x.amount) +
              '</td><td class="num">' + esc(x.installments) + '</td><td>' + esc(x.reason || '') + '</td><td><span class="badge ' + x.status + '">' + x.status + '</span></td><td>' + apvActions(x) + '</td></tr>';
          }).join('');
          area.innerHTML = '<p class="muted">You can approve <b>product advances</b> only.</p>' +
            (rows ? '<div class="scroll"><table><thead><tr><th>Employee</th><th>Type</th><th class="num">Amount</th><th class="num">Cutoffs</th><th>Reason</th><th>Status</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '<p class="muted">No product-advance applications.</p>');
          apvBind(area, '/api/admin/loan-requests', 'loans');
        });
      }
    }
  </script>
  <script src="/shared/js/idle.js"></script>
</body>
</html>
